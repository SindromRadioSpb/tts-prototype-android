[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linguistpro-media-acquisition"
version = "0.1.0"
description = "Bounded first-party remote-media acquisition worker for LinguistPro"
requires-python = ">=3.12,<3.15"
dependencies = [
  "yt-dlp[default]==2026.7.4",
]

[project.scripts]
linguistpro-media-acquisition = "acquisition_service.main:main"

[tool.setuptools]
packages = ["acquisition_service"]
